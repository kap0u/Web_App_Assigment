<!DOCTYPE html>
<html>
<head>
  <title>Update Password</title>
  <link rel="stylesheet" href="style.css">
  <script src="js/update-password.js" defer></script>
</head>
<body>
  <h2>Update Password</h2>
  <form method="post" action="update-password" id="updateForm">
    <input type="text" name="username" placeholder="Username" required><br>
    <input type="password" name="oldpass" placeholder="Current Password" required><br>
    <input type="password" name="newpass1" placeholder="New Password" required><br>
    <input type="password" name="newpass2" placeholder="Repeat New Password" required><br>
    <input type="submit" value="Update">
  </form>
  <div id="message"></div>
  <link rel="stylesheet" href="style.css">
</body>
</html>
